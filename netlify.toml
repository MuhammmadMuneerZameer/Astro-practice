[build]
  command = "npm run build && node scripts/check-links.js && node scripts/check-images.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_FIREBASE_API_KEY,PUBLIC_FIREBASE_PROJECT_ID,PUBLIC_FIREBASE_AUTH_DOMAIN,PUBLIC_FIREBASE_MEASUREMENT_ID,PUBLIC_FIREBASE_MESSAGING_SENDER_ID,PUBLIC_FIREBASE_APP_ID,PUBLIC_FIREBASE_STORAGE_BUCKET"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://firestore.googleapis.com https://www.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.imgbb.com https://stream.mux.com; img-src 'self' data: blob: https://i.ibb.co https://ibb.co https://stream.mux.com https://images.unsplash.com https://arooshcosmetics.pk; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://formspree.io;"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/case-studies/"
  to = "/work/"
  status = 301

[[redirects]]
  from = "/services/store-design-build/"
  to = "/services/shopify/"
  status = 301

[[redirects]]
  from = "/services/store-design-build/*"
  to = "/services/shopify/"
  status = 301

[[redirects]]
  from = "/services/growth-tools-automation/"
  to = "/services/growth-tools/"
  status = 301

[[redirects]]
  from = "/services/growth-tools-automation/*"
  to = "/services/growth-tools/"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/work/"
  status = 301

[[redirects]]
  from = "/industries/real-estate-brands/"
  to = "/industries/"
  status = 301

[[redirects]]
  from = "/industries/startups/"
  to = "/industries/"
  status = 301

[[redirects]]
  from = "/services/*/real-estate-brands/"
  to = "/industries/"
  status = 301

[[redirects]]
  from = "/services/*/startups/"
  to = "/industries/"
  status = 301

[[redirects]]
  from = "/services/web/"
  to = "/services/"
  status = 302
  force = false

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Performance budget — auto-installed by Netlify on first deploy
# Fails the deploy if Lighthouse performance score drops below 0.85
# or accessibility below 0.90.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    output_path = "reports/lighthouse.html"

  [plugins.inputs.thresholds]
    performance = 0.85
    accessibility = 0.90
